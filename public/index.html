    <style>
        * { -webkit-tap-highlight-color: transparent; }

        /* ============================================================
           MUSIFYRIK DESIGN SYSTEM — Futuristic Dark Dashboard
           10 swappable accent themes via [data-theme] + CSS variables
           ============================================================ */
        :root {
            --bg-color: #0a0b12;
            --surface: #12131c;
            --surface-2: #181a26;
            --text-primary: #f4f5f9;
            --text-secondary: #8b8fa3;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #22d3ee;
            --accent-2: #6366f1;
            --accent-rgb: 34, 211, 238;
            --accent-2-rgb: 99, 102, 241;
            --radius-lg: 1.5rem;
            --radius-md: 1rem;
            --radius-sm: 0.7rem;
        }

        [data-theme="cyan"]    { --accent:#22d3ee; --accent-2:#0ea5e9; --accent-rgb:34,211,238;  --accent-2-rgb:14,165,233; }
        [data-theme="purple"]  { --accent:#a855f7; --accent-2:#7c3aed; --accent-rgb:168,85,247;  --accent-2-rgb:124,58,237; }
        [data-theme="blue"]    { --accent:#3b82f6; --accent-2:#2563eb; --accent-rgb:59,130,246;  --accent-2-rgb:37,99,235; }
        [data-theme="pink"]    { --accent:#ec4899; --accent-2:#db2777; --accent-rgb:236,72,153;  --accent-2-rgb:219,39,119; }
        [data-theme="red"]     { --accent:#ef4444; --accent-2:#dc2626; --accent-rgb:239,68,68;   --accent-2-rgb:220,38,38; }
        [data-theme="orange"]  { --accent:#f97316; --accent-2:#ea580c; --accent-rgb:249,115,22;  --accent-2-rgb:234,88,12; }
        [data-theme="yellow"]  { --accent:#eab308; --accent-2:#ca8a04; --accent-rgb:234,179,8;   --accent-2-rgb:202,138,4; }
        [data-theme="green"]   { --accent:#22c55e; --accent-2:#16a34a; --accent-rgb:34,197,94;   --accent-2-rgb:22,163,74; }
        [data-theme="emerald"] { --accent:#10b981; --accent-2:#059669; --accent-rgb:16,185,129;  --accent-2-rgb:5,150,105; }
        [data-theme="violet"]  { --accent:#8b5cf6; --accent-2:#6d28d9; --accent-rgb:139,92,246;  --accent-2-rgb:109,40,217; }

        html, body { background: var(--bg-color); color: var(--text-primary); transition: background 0.6s cubic-bezier(0.22, 1, 0.36, 1), color 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: max(2.5rem, env(safe-area-inset-top)); }
        .fill-current { fill: currentColor; }
        .filter-tab.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)) !important; color: #050608 !important; box-shadow: 0 6px 20px rgba(var(--accent-rgb), 0.35); }

        /* ===== Ambient futuristic background ===== */
        .app-bg {
            position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
            background:
                radial-gradient(circle at 12% -8%, rgba(var(--accent-rgb), 0.20), transparent 45%),
                radial-gradient(circle at 105% 15%, rgba(var(--accent-2-rgb), 0.16), transparent 40%),
                radial-gradient(circle at 50% 115%, rgba(var(--accent-rgb), 0.10), transparent 45%),
                #07080d;
            transition: background 0.6s ease;
        }
        .app-bg::before {
            content: '';
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(circle at 50% 0%, black, transparent 70%);
        }

        /* ===== Card / Surface system ===== */
        .glass-card, .mz-card {
            background: linear-gradient(160deg, var(--surface-2), var(--surface));
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: 0 10px 28px rgba(0,0,0,0.45);
            transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), border-color 0.28s ease, box-shadow 0.28s ease;
        }
        .glass-card:hover, .mz-card:hover {
            border-color: rgba(var(--accent-rgb), 0.45);
            box-shadow: 0 14px 34px rgba(0,0,0,0.55), 0 0 0 1px rgba(var(--accent-rgb), 0.12), 0 10px 30px -8px rgba(var(--accent-rgb), 0.35);
            transform: translateY(-3px);
        }
        .glass-dock {
            background: rgba(15, 16, 24, 0.82);
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow: 0 18px 44px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .glass {
            background: linear-gradient(160deg, var(--surface-2), var(--surface));
            box-shadow: 0 10px 26px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .glass-hover {
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease;
        }
        .glass-hover:hover {
            border-color: rgba(var(--accent-rgb), 0.35);
            transform: translateY(-2px);
        }
        .glass-strong {
            background: var(--surface);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .glass-input {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .glass-input:focus-within, .glass-input:focus {
            border-color: rgba(var(--accent-rgb), 0.55);
            box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.12);
        }
        .glass-pane {
            background: var(--surface);
        }
        .glass-edge {
            border: 1px solid var(--border-color);
        }

        /* Accent gradient wordmark */
        .chrome-text{
            background: linear-gradient(120deg, var(--accent), var(--accent-2) 55%, var(--accent));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            font-weight: 900; letter-spacing: -0.01em;
        }

        .btn-chrome {
            position: relative;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-chrome:hover {
            transform: scale(1.02);
            border-color: rgba(var(--accent-rgb), 0.4);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1);
        }
        .btn-chrome:active {
            transform: scale(0.97);
        }

        .shine-sweep{position:relative;}

        .nav-blur {
            background: rgba(12, 13, 20, 0.85);
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -12px 30px rgba(0,0,0,0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .artist-photo { width:120px; height:120px; border-radius:28px; object-fit:cover; border:2px solid rgba(var(--accent-rgb),0.35); box-shadow:0 10px 30px rgba(0,0,0,0.5), 0 0 0 6px rgba(var(--accent-rgb),0.06); background:var(--surface); }
        @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
        .animate-slide-up{animation:slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards}

        /* ===== Mini player: prev/next skip buttons ===== */
        #mini-prev-btn, #mini-next-btn {
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s ease;
        }
        #mini-prev-btn:active, #mini-next-btn:active { transform: scale(0.85); }
        #mini-prev-btn div, #mini-next-btn div { transition: background-color 0.2s ease, transform 0.2s ease; }
        #mini-prev-btn:hover div, #mini-next-btn:hover div { transform: scale(1.08); }
        @media (hover: none) {
            #mini-prev-btn:hover div, #mini-next-btn:hover div { transform: none; background-color: transparent; }
        }

        /* ===== Accent-aware nav item state ===== */
        .nav-item.active-nav, .nav-item[aria-current="true"] {
            color: var(--accent) !important;
        }
        .nav-item .nav-icon-active-bg { background: rgba(var(--accent-rgb), 0.14); }

        /* ===== Theme picker FAB + sheet ===== */
        .theme-fab {
            position: fixed; z-index: 155;
            right: 16px; bottom: 172px;
            width: 46px; height: 46px; border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 26px rgba(var(--accent-rgb), 0.45), 0 0 0 1px rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; color: #050608;
            transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
        }
        .theme-fab:active { transform: scale(0.9) rotate(25deg); }
        .theme-sheet-backdrop {
            position: fixed; inset: 0; z-index: 300;
            background: rgba(4,5,8,0.72); backdrop-filter: blur(6px);
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .theme-sheet-backdrop.open { opacity: 1; pointer-events: auto; }
        .theme-sheet {
            width: 100%; max-width: 480px;
            background: linear-gradient(180deg, var(--surface-2), var(--surface));
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 28px 28px 0 0;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 12px));
            transform: translateY(100%);
            transition: transform 0.38s cubic-bezier(0.22,1,0.36,1);
            box-shadow: 0 -20px 60px rgba(0,0,0,0.6);
        }
        .theme-sheet-backdrop.open .theme-sheet { transform: translateY(0); }
        .theme-swatch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 14px; }
        .theme-swatch {
            aspect-ratio: 1; border-radius: 16px; cursor: pointer; border: 2px solid transparent;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
        }
        .theme-swatch:active { transform: scale(0.9); }
        .theme-swatch.selected { border-color: #fff; }
        .theme-swatch.selected::after {
            content: ''; position: absolute; inset: -5px; border-radius: 19px;
            border: 2px solid rgba(255,255,255,0.5);
        }

        /* WhatsApp Channel entry point */
        .wa-channel-btn {
            display: flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, rgba(37,211,102,0.16), rgba(37,211,102,0.05));
            border: 1px solid rgba(37,211,102,0.35);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: #f4f5f9;
            transition: transform 0.25s ease, background 0.25s ease;
        }
        .wa-channel-btn:hover { transform: translateY(-2px); background: rgba(37,211,102,0.2); }
        .wa-channel-icon { width: 38px; height: 38px; border-radius: 12px; background: #25d366; display:flex; align-items:center; justify-content:center; color:#04120a; flex-shrink:0; }


        /* ===== SPLASH SCREEN - MONOCHROME ===== */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 45%, rgba(var(--accent-rgb),0.16) 0%, #050608 65%);
            transform-origin: center center;
            will-change: transform, opacity;
            animation: splashEntranceZoomOut 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #splash-screen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.3);
        }

        @keyframes splashEntranceZoomOut {
            0% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .splash-rings {
            position: relative;
            width: 300px; height: 300px;
            display: flex; align-items: center; justify-content: center;
        }
        .splash-rings span {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(var(--accent-rgb),0.35);
            animation: splashWave 2.8s cubic-bezier(.4,0,.2,1) infinite;
        }
        .splash-rings span:nth-child(2) { animation-delay: .7s; }
        .splash-rings span:nth-child(3) { animation-delay: 1.4s; }
        .splash-rings span:nth-child(4) { animation-delay: 2.1s; }

        @keyframes splashWave {
            0% { transform: scale(.3); opacity: 0; }
            15% { opacity: .7; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .splash-disc {
            position: absolute;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 2px, transparent 7px);
            box-shadow: 0 0 60px rgba(255,255,255,0.1), inset 0 0 40px rgba(0,0,0,0.7);
            animation: splashSpin 7s linear infinite;
        }
        .splash-disc::before {
            content: '';
            position: absolute; inset: -10px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.2), rgba(255,255,255,0.4), rgba(255,255,255,0.2), transparent);
            animation: splashShimmer 3s linear infinite;
            filter: blur(15px); z-index: -1;
        }

        @keyframes splashSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes splashShimmer { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .splash-logo-wrap {
            position: relative;
            width: 170px; height: 170px;
            border-radius: 42px;
            background: rgba(0,0,0,0.8);
            border: 2px solid rgba(var(--accent-rgb),0.4);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            animation: splashPulse 2.4s ease-in-out infinite;
            z-index: 2;
        }
        .splash-logo-wrap img {
            width: 85%; height: 85%;
            object-fit: cover;
            border-radius: 28px;
            filter: drop-shadow(0 4px 14px rgba(var(--accent-rgb),0.35));
        }
        .splash-logo-wrap::after {
            content: '';
            position: absolute; inset: 0;
            border-radius: 50%;
            background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.2) 48%, transparent 62%);
            background-size: 250% 250%;
            animation: sheenMove 4.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes splashPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(var(--accent-rgb),0.2), inset 0 1px 0 rgba(255,255,255,0.15); }
            50% { box-shadow: 0 0 60px rgba(var(--accent-rgb),0.4), inset 0 1px 0 rgba(255,255,255,0.3); }
        }

        .splash-title { margin-top: 30px; font-weight: 900; font-size: 1.3rem; letter-spacing: .02em; }
        .splash-sub { margin-top: 6px; font-size: .7rem; color: #7c828c; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
        .splash-bar { margin-top: 24px; width: 120px; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden; }
        .splash-bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: splashBar 1.4s ease-in-out infinite; }
        @keyframes splashBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

        /* High-Performance Blurred Artwork Background for Player & Lyrics */
        .player-bg-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background-color: #06070a;
            will-change: transform;
            transform: translateZ(0);
        }

        .player-bg-blur-img {
            position: absolute;
            inset: -10%;
            width: 120%;
            height: 120%;
            object-fit: cover;
            filter: blur(24px) brightness(0.65) contrast(1.1);
            -webkit-filter: blur(24px) brightness(0.65) contrast(1.1);
            opacity: 0.85;
            transition: opacity 0.3s ease;
            will-change: opacity, transform;
            transform: translateZ(0);
        }

        .player-bg-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background: linear-gradient(to bottom, rgba(8,9,13,0.55) 0%, rgba(8,9,13,0.25) 45%, rgba(8,9,13,0.8) 100%);
        }

        /* ============================================================
           PREMIUM FULL PLAYER CARD — iOS-style Now Playing card
           ============================================================ */
        #full-player {
            background: rgba(4, 5, 8, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .fp-card {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 900px;
            margin: 0 auto;
            border-radius: 34px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow: 0 24px 70px rgba(0,0,0,0.65), 0 4px 18px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
            background: linear-gradient(180deg, rgba(var(--fp-accent-rgb, var(--accent-rgb)),0.32) 0%, rgba(9,10,15,0.94) 45%, #06070a 100%);
            transition: background 0.6s cubic-bezier(0.22,1,0.36,1);
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 640px) {
            .fp-card { max-height: 94vh; }
        }
        .fp-thumb {
            width: 13px; height: 13px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .fp-output-btn {
            width: 34px; height: 34px;
            border-radius: 999px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.85);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .fp-output-btn:active { transform: scale(0.9); }
        .fp-output-btn:hover { background: rgba(255,255,255,0.15); }
        .fp-source-row { color: rgba(255,255,255,0.55); font-size: 11px; font-weight: 700; letter-spacing: 0.02em; display:flex; align-items:center; gap:5px; }
        @keyframes fpCoverIn {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .fp-cover-anim { animation: fpCoverIn 0.45s cubic-bezier(0.22,1,0.36,1); }
        @keyframes fpSheetSlide {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .fp-sheet { animation: fpSheetSlide 0.3s cubic-bezier(0.22,1,0.36,1) forwards; touch-action: none; }
        .fp-sheet-row {
            display: flex; align-items: center; gap: 14px;
            padding: 13px 6px;
            border-radius: 16px;
            transition: background 0.2s ease, transform 0.15s ease;
            cursor: pointer;
        }
        .fp-sheet-row:active { background: rgba(255,255,255,0.08); transform: scale(0.98); }
        .fp-sheet-icon {
            width: 38px; height: 38px; border-radius: 12px;
            display:flex; align-items:center; justify-content:center;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
            flex-shrink:0;
        }
        @keyframes shareCardIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .share-card-anim { animation: shareCardIn 0.32s cubic-bezier(0.22,1,0.36,1) forwards; }

        /* Extra Dark & Heavy Blur Background for Lyrics Overlay */
        #lyrics-overlay {
            background-color: #05060a !important;
        }
        #lyrics-overlay .player-bg-blur-img {
            filter: blur(60px) brightness(0.18) contrast(1.2) saturate(110%) !important;
            -webkit-filter: blur(60px) brightness(0.18) contrast(1.2) saturate(110%) !important;
            opacity: 0.65 !important;
        }
        #lyrics-overlay .player-bg-vignette {
            background: radial-gradient(circle at center, rgba(4,5,8,0.82) 0%, rgba(4,5,8,0.96) 100%),
                        linear-gradient(to bottom, rgba(4,5,8,0.9) 0%, rgba(4,5,8,0.8) 50%, rgba(4,5,8,0.98) 100%) !important;
        }

        /* Premium Lyric Highlighting Styling */
        #lyrics-scroll-container {
            -webkit-overflow-scrolling: touch;
        }
        .lyric-line {
            transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1), transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), color 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            font-size: 1.45rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.35);
            opacity: 0.4;
            padding: 10px 0;
            line-height: 1.35;
            letter-spacing: -0.02em;
            will-change: opacity, color, transform;
            cursor: pointer;
            text-align: left;
            transform-origin: left center;
        }
        @media (min-width: 768px) {
            .lyric-line {
                font-size: 2.15rem;
                padding: 14px 0;
                line-height: 1.3;
            }
        }
        .lyric-line.active-lyric {
            opacity: 1 !important;
            color: #ffffff !important;
            transform: scale(1.06) translateX(4px);
        }
        .lyric-line.past-lyric {
            opacity: 0.28 !important;
            color: rgba(255, 255, 255, 0.4) !important;
            transform: scale(0.97);
        }
        .lyric-translation {
            display: block;
            font-size: 0.58em;
            font-weight: 500;
            opacity: 0.75;
            margin-top: 4px;
            letter-spacing: 0;
            line-height: 1.35;
            color: inherit;
        }
        .inline-lyric-line .lyric-translation {
            font-size: 0.78em;
            margin-top: 2px;
            opacity: 0.8;
            font-weight: 500;
        }

        /* Inline Lyric Highlighting for FullPlayer Compact Box */
        .inline-lyric-line {
            transition: opacity 0.25s ease, color 0.25s ease;
            font-size: 0.92rem;
            line-height: 1.4;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0.5;
            padding: 5px 0;
            letter-spacing: -0.01em;
            cursor: pointer;
            text-align: left;
            word-break: break-word;
        }
        .inline-lyric-line.active-lyric {
            opacity: 1 !important;
            color: #ffffff !important;
            font-weight: 800 !important;
        }
        .inline-lyric-line.past-lyric {
            opacity: 0.3 !important;
            color: rgba(255, 255, 255, 0.35) !important;
        }

        /* Neumorphic Equalizer & Slider styling */
        .eq-slider {
            -webkit-appearance: none;
            width: 8px;
            height: 150px;
            background: var(--bg-color);
            box-shadow: var(--nm-shadow-inset-sm);
            border-radius: 4px;
            outline: none;
            writing-mode: bt-lr; /* IE */
            -webkit-appearance: slider-vertical; /* WebKit */
        }
        .eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-color);
            box-shadow: var(--nm-shadow-flat-sm);
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .eq-slider::-webkit-slider-thumb:active {
            transform: scale(1.15);
            box-shadow: var(--nm-shadow-inset-sm);
        }

        /* Rotating Thumbnail Animation for Mini Player */
        .spin-record {
            animation: spinRecord 10s linear infinite;
            will-change: transform;
        }
        @keyframes spinRecord {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Animated Bouncing Equalizer Bars for Active Track */
        @keyframes eqBounce1 { 0%, 100% { height: 3px; } 50% { height: 20px; } }
        @keyframes eqBounce2 { 0%, 100% { height: 18px; } 50% { height: 4px; } }
        @keyframes eqBounce3 { 0%, 100% { height: 5px; } 50% { height: 24px; } }
        @keyframes eqBounce4 { 0%, 100% { height: 22px; } 50% { height: 6px; } }
        @keyframes eqBounce5 { 0%, 100% { height: 4px; } 50% { height: 16px; } }
        @keyframes eqBounce6 { 0%, 100% { height: 26px; } 50% { height: 8px; } }

        .animate-eq-1 { animation: eqBounce1 0.45s ease-in-out infinite; }
        .animate-eq-2 { animation: eqBounce2 0.65s ease-in-out infinite; }
        .animate-eq-3 { animation: eqBounce3 0.50s ease-in-out infinite; }
        .animate-eq-4 { animation: eqBounce4 0.80s ease-in-out infinite; }
        .animate-eq-5 { animation: eqBounce5 0.60s ease-in-out infinite; }
        .animate-eq-6 { animation: eqBounce6 0.70s ease-in-out infinite; }

        /* Equalizer live-animated bar visualizer */
        .eq-bar {
            width: 5px;
            height: 10px;
            background: linear-gradient(to top, var(--accent-2), var(--accent));
            border-radius: 2px;
            transition: height 0.1s ease-out;
        }

        /* Responsive Bottom Navigation Bar Styles */
        .nav-blur {
            background: rgba(14, 15, 22, 0.96);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }
        .nav-icon-wrapper {
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Page Slide Animations */
        @keyframes slideInRight {
            0% { transform: translateX(30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideInLeft {
            0% { transform: translateX(-30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-right {
            animation: slideInRight 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .animate-slide-left {
            animation: slideInLeft 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Search Results & Cards Entrance Animations */
        @keyframes cardUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardLeft {
            0% { opacity: 0; transform: translateX(-10px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .animate-card-up {
            animation: cardUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .animate-card-left {
            animation: cardLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .transition-all, .transition, .transition-colors, .transition-opacity, .transition-transform {
            transition-duration: 500ms !important;
            transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1) !important;
        }
    </style>
</head>
