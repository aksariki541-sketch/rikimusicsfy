    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* === RESET & BASE - High Perf Portfolio Inspired === */
        * { -webkit-tap-highlight-color: transparent; }
        * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
        html { background:#050507; }
        html, body { 
            background: #050507; 
            color: #f4f8ff; 
            font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
            letter-spacing: -0.012em;
            overscroll-behavior: none;
            /* Removed heavy transition on body */
        }
        :root {
            --bg:#050507;
            --surface:#0e0e12;
            --surface-2:#14151c;
            --line:rgba(255,255,255,0.08);
            --line-strong:rgba(255,255,255,0.14);
            --text:#f4f8ff;
            --muted:#9aa0af;
            --muted-2:#6b7280;
            --accent:#ffffff;
            --radius:1.1rem;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: max(2.5rem, env(safe-area-inset-top)); }
        .fill-current { fill: currentColor; }

        /* === APP BACKGROUND - Lightweight Portfolio Grid === */
        .app-bg {
            position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background: #050507;
        }
        .app-bg::before{
            content:"";
            position:absolute; inset:0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            opacity:0.55;
        }
        .app-bg::after{
            content:"";
            position:absolute; inset:0;
            background:
                radial-gradient(520px 360px at 12% -4%, rgba(255,255,255,0.06), transparent 60%),
                radial-gradient(560px 380px at 92% 12%, rgba(255,255,255,0.04), transparent 62%),
                radial-gradient(540px 360px at 50% 105%, rgba(255,255,255,0.05), transparent 68%);
            pointer-events:none;
        }

        /* === Cards - Portfolio Minimal + GPU Only === */
        .glass-card, .glass, .glass-dock, .glass-strong, .btn-chrome {
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        .glass-card {
            background: #121318;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: none;
            transition: transform 0.22s cubic-bezier(.25,1,.5,1), border-color 0.22s ease, background 0.22s ease;
        }
        .glass-card:hover {
            background: #171821;
            border-color: var(--line-strong);
            transform: translateY(-1px) translateZ(0);
        }
        .glass {
            background: #121318;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            transition: transform 0.22s cubic-bezier(.25,1,.5,1), border-color 0.22s ease;
        }
        .glass-hover {
            transition: transform 0.22s cubic-bezier(.25,1,.5,1);
        }
        .glass-hover:hover { transform: translateY(-1px) translateZ(0); }
        .glass-dock {
            background: rgba(10,10,14,0.92);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 1.5rem;
            box-shadow: 0 12px 32px rgba(0,0,0,0.55);
            /* Removed backdrop-blur - heavy! Use solid */
        }
        .glass-strong {
            background: #0e0e12;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            transition: transform 0.22s cubic-bezier(.25,1,.5,1);
        }
        .glass-input {
            background: #0a0a0d;
            border: 1px solid var(--line);
            border-radius: 0.75rem;
            transition: border-color 0.2s ease;
        }
        .glass-input:focus-within { border-color: rgba(255,255,255,0.22); }
        .glass-pane { background: var(--bg); }
        .glass-edge { border: 1px solid var(--line); }

        .chrome-text { color:#fff; font-weight:800; letter-spacing:-0.04em; }
        .btn-chrome{
            background: #fff;
            color: #000;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 0.9rem;
            font-weight: 700;
            transition: transform 0.18s cubic-bezier(.25,1,.5,1), opacity 0.18s ease;
        }
        .btn-chrome:hover{ transform: scale(1.02) translateZ(0); }
        .btn-chrome:active{ transform: scale(0.98) translateZ(0); }
        .btn-ghost{
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 0.9rem;
            transition: transform 0.18s ease, background 0.18s ease;
        }
        .btn-ghost:hover{ background: rgba(255,255,255,0.10); transform: translateY(-1px); }

        .nav-blur { background: rgba(8,8,11,0.96); border-top: 1px solid var(--line); }
        .filter-tab.active { background:#fff !important; color:#000 !important; font-weight:800; }
        .filter-tab { transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease; will-change: transform; }
        .filter-tab:hover { transform: translateY(-1px); }

        /* === SPLASH - Ultra Lightweight (PP as icon) === */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #050507;
            transition: opacity 0.45s cubic-bezier(.25,1,.5,1), transform 0.45s cubic-bezier(.25,1,.5,1);
            transform-origin: center;
            will-change: opacity, transform;
        }
        #splash-screen.hide { opacity:0; visibility:hidden; pointer-events:none; transform: scale(1.06) translateZ(0); }
        .splash-rings{
            position:relative; width:220px; height:220px; display:flex; align-items:center; justify-content:center;
            transform: translateZ(0);
        }
        .splash-ring{
            position:absolute; inset:0; border-radius:50%;
            border:1px solid rgba(255,255,255,0.14);
            opacity:0;
            transform: scale(0.75) translateZ(0);
            animation: splashWave 2.2s cubic-bezier(.25,1,.5,1) infinite;
            will-change: transform, opacity;
        }
        .splash-ring:nth-child(2){ animation-delay:0.7s; border-color: rgba(255,255,255,0.10); }
        @keyframes splashWave{
            0%{ transform: scale(0.72) translateZ(0); opacity:0; }
            20%{ opacity:0.6; }
            100%{ transform: scale(1.35) translateZ(0); opacity:0; }
        }
        .splash-logo-wrap{
            position:relative; width:124px; height:124px; border-radius:50%;
            background: #0e0e12;
            border:1px solid rgba(255,255,255,0.18);
            display:flex; align-items:center; justify-content:center;
            overflow:hidden;
            transform: translateZ(0);
            box-shadow: 0 0 0 6px rgba(255,255,255,0.04);
            animation: splashPulse 2.2s cubic-bezier(.25,1,.5,1) infinite;
            will-change: transform, box-shadow;
        }
        .splash-logo-wrap img{
            width:100%; height:100%; object-fit:cover; border-radius:50%;
            transform: translateZ(0);
        }
        @keyframes splashPulse{ 0%,100%{ transform: scale(1) translateZ(0); } 50%{ transform: scale(1.03) translateZ(0); } }
        .splash-title{ margin-top:22px; font-family:"Space Grotesk"; font-weight:800; font-size:0.85rem; letter-spacing:0.22em; color:#fff; }
        .splash-sub{ margin-top:6px; font-family:"DM Mono"; font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); opacity:0.9; }
        .splash-bar{ margin-top:18px; width:88px; height:2px; border-radius:2px; background: rgba(255,255,255,0.10); overflow:hidden; position:relative; }
        .splash-bar i{ display:block; height:100%; width:42%; background:#fff; position:absolute; left:-42%; animation:splashBar 1.15s cubic-bezier(.25,1,.5,1) infinite; will-change: transform; }
        @keyframes splashBar{ 0%{ transform: translateX(0); } 100%{ transform: translateX(304%); } }

        /* === Player Blurred Artwork - Reduced Blur for Perf === */
        .player-bg-container{
            position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
            background:#050507;
            transform: translateZ(0);
        }
        .player-bg-blur-img{
            position:absolute; inset:-8%; width:116%; height:116%; object-fit:cover;
            filter: blur(18px) brightness(0.55);
            -webkit-filter: blur(18px) brightness(0.55);
            opacity:0.82;
            transform: translateZ(0);
            will-change: opacity;
            transition: opacity 0.28s ease;
            /* content-visibility saves paint */
            content-visibility: auto;
        }
        .player-bg-vignette{
            position:absolute; inset:0; z-index:1; pointer-events:none;
            background: linear-gradient(to bottom, rgba(5,5,7,0.60) 0%, rgba(5,5,7,0.22) 44%, rgba(5,5,7,0.86) 100%);
        }
        #lyrics-overlay{ background:#050507 !important; }
        #lyrics-overlay .player-bg-blur-img{ filter: blur(38px) brightness(0.18) !important; opacity:0.58 !important; }
        #lyrics-overlay .player-bg-vignette{ background: linear-gradient(to bottom, rgba(5,5,7,0.92), rgba(5,5,7,0.98)) !important; }

        /* === Lyrics - Portfolio Mono + Bold === */
        #lyrics-scroll-container{ -webkit-overflow-scrolling: touch; }
        .lyric-line{
            transition: opacity 0.22s ease, transform 0.22s cubic-bezier(.25,1,.5,1), color 0.22s ease;
            font-size:1.35rem; font-weight:700; letter-spacing:-0.02em; line-height:1.32;
            color: rgba(255,255,255,0.30);
            opacity:0.5; padding:9px 0; cursor:pointer; text-align:left;
            transform-origin:left center; transform: translateZ(0);
            will-change: opacity, transform;
        }
        @media(min-width:768px){ .lyric-line{ font-size:2.05rem; padding:12px 0; } }
        .lyric-line.active-lyric{ opacity:1 !important; color:#fff !important; transform: scale(1.04) translateX(2px) translateZ(0); }
        .lyric-line.past-lyric{ opacity:0.28 !important; }
        .lyric-translation{ display:block; font-family:"DM Mono"; font-size:0.52em; font-weight:400; opacity:0.7; margin-top:4px; letter-spacing:0; }
        .inline-lyric-line{
            transition: opacity 0.18s ease, color 0.18s ease;
            font-size:0.88rem; line-height:1.4; font-weight:600;
            color: rgba(255,255,255,0.38); opacity:0.5; padding:4px 0;
            transform: translateZ(0);
        }
        .inline-lyric-line.active-lyric{ opacity:1 !important; color:#fff !important; font-weight:800 !important; }
        .inline-lyric-line.past-lyric{ opacity:0.28 !important; }

        .eq-slider{ -webkit-appearance:none; width:8px; height:140px; background:#14151c; border-radius:4px; outline:none; border:1px solid var(--line); }
        .eq-slider::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; border:1px solid rgba(255,255,255,0.2); cursor:pointer; }

        .spin-record{ animation: spinRecord 12s linear infinite; will-change: transform; transform: translateZ(0); }
        @keyframes spinRecord{ from{transform: rotate(0deg) translateZ(0);} to{transform: rotate(360deg) translateZ(0);} }

        @keyframes eqBounce1{0%,100%{height:3px}50%{height:18px}} @keyframes eqBounce2{0%,100%{height:16px}50%{height:4px}} @keyframes eqBounce3{0%,100%{height:5px}50%{height:22px}}
        .animate-eq-1{animation:eqBounce1 0.48s ease-in-out infinite} .animate-eq-2{animation:eqBounce2 0.62s ease-in-out infinite} .animate-eq-3{animation:eqBounce3 0.55s ease-in-out infinite}
        .eq-bar{ width:4px; height:10px; background:#fff; border-radius:2px; opacity:0.85; }

        /* Slide animations - GPU only */
        @keyframes slideInRight{ from{ transform: translateX(18px) translateZ(0); opacity:0 } to{ transform: translateX(0) translateZ(0); opacity:1 } }
        @keyframes slideInLeft{ from{ transform: translateX(-18px) translateZ(0); opacity:0 } to{ transform: translateX(0) translateZ(0); opacity:1 } }
        .animate-slide-right{ animation: slideInRight 0.26s cubic-bezier(.25,1,.5,1) both; }
        .animate-slide-left{ animation: slideInLeft 0.26s cubic-bezier(.25,1,.5,1) both; }
        @keyframes cardUp{ from{ opacity:0; transform: translateY(8px) translateZ(0); } to{ opacity:1; transform: translateY(0) translateZ(0); } }
        .animate-card-up{ animation: cardUp 0.28s cubic-bezier(.25,1,.5,1) both; will-change: transform, opacity; }
        .animate-card-left{ animation: cardUp 0.28s cubic-bezier(.25,1,.5,1) both; }

        /* Remove heavy global 500ms transition - key perf fix */
        .transition-all, .transition, .transition-colors, .transition-opacity, .transition-transform{
            transition-duration: 200ms !important;
            transition-timing-function: cubic-bezier(.25,1,.5,1) !important;
        }

        /* Portfolio-like eyebrow */
        .riki-eyebrow{ font-family:"DM Mono"; font-size:0.58rem; letter-spacing:0.14em; text-transform:uppercase; color:#fff; opacity:0.62; }
        .riki-topbar{ background: linear-gradient(180deg, rgba(18,19,24,0.92) 0%, rgba(8,8,11,0.96) 100%); border-bottom:1px solid var(--line); backdrop-filter:none; /* no blur! */ }

        /* Chrome text removed neon */
        @keyframes slideUp{from{transform:translateY(100%) translateZ(0);opacity:0}to{transform:translateY(0) translateZ(0);opacity:1}}
        .animate-slide-up{animation:slideUp 0.34s cubic-bezier(.25,1,.5,1) forwards}

        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}}
    </style>
    <link rel="stylesheet" href="/riki-theme.css?v=2">
    <script src="/theme.js?v=2"></script>
</head>
<body class="h-[100dvh] w-full bg-[#050507] text-white font-sans overflow-hidden flex flex-col">

                <img src="/profile.jpg" alt="musicfyrik" />
            </div>

        <div class="splash-bar"><i></i></div>
    </div>

    <div class="flex-1 overflow-y-auto overflow-x-hidden pb-[140px] hide-scrollbar" id="main-area">

        <div id="view-search" style="display:none;"></div>

    <div id="nav-container"></div>

    <script src="/player.js?v=16"></script>
    <script src="/home.js?v=16"></script>
    <script src="/search.js?v=16"></script>
    <script src="/liked.js?v=16"></script>
    <script src="/library.js?v=16"></script>
    <script src="/profile.js?v=16"></script>
    <script src="/miniplayer.js?v=16"></script>
    <script src="/fullplayer.js?v=16"></script>
    <script src="/artist.js?v=16"></script>
    <script src="/album.js?v=16"></script>
    <script src="/app.js?v=16"></script>
    <script>
        document.addEventListener('visibilitychange', function(){ document.documentElement.classList.toggle('tab-hidden', document.hidden); });
        setTimeout(function(){
            // Jangan hapus splash saat PWA sudah terinstall, agar banner tetap ada
            var isInstalled = (window.navigator.standalone === true) || (localStorage.getItem('pwa_installed') === 'true');
            var sp=document.getElementById('splash-screen');
            if(sp && !sp.classList.contains('hide') && !isInstalled){
                sp.classList.add('hide');
            }
        }, 2400);
    </script>
</body>
